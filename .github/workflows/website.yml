name: Website

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npx -y npm@11.6.2 ci  # same npm that writes package-lock.json
      - run: npm run check
      - run: npm run build
      - run: npm test
      - uses: actions/upload-artifact@v7
        with:
          name: website-dist
          path: dist/
          if-no-files-found: error
          retention-days: 1

  # Deploys only from main, never from pull requests (forks get no secrets).
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://www.bettercode.se/
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npx -y npm@11.6.2 ci
      - uses: actions/download-artifact@v8
        with:
          name: website-dist
          path: dist/
      - uses: cloudflare/wrangler-action@v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
      - name: Check the live site
        run: |
          for path in / /archive/ /2009/10/13/the-joel-test.html /sitemap.xml /favicon.ico; do
            curl -fsS --retry 5 --retry-delay 5 --retry-all-errors -o /dev/null "https://www.bettercode.se$path" \
              || { echo "::error::https://www.bettercode.se$path is not served"; exit 1; }
          done
